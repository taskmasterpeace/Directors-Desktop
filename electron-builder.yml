appId: com.lightricks.ltx-desktop
productName: Director's Desktop
copyright: Copyright © 2026 Machine King Labs

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - LICENSE.txt
  - NOTICES.md
  - "!**/*.map"

asarUnpack:
  - dist/splash/**

extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*.py"
      - pyproject.toml
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!.venv/**"
      - "!outputs/**"
      - "!models/**"
      - "!tests/**"
  - from: python-deps-hash.txt
    to: python-deps-hash.txt

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: ${productName}-Setup.${ext}
  # Code signing: intentionally unset. The upstream Lightricks certificate is
  # not ours to use. Ship unsigned (SmartScreen shows a one-time warning) or
  # set CSC_LINK / CSC_KEY_PASSWORD env vars with a Machine King Labs cert.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: resources/installer.nsh
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Director's Desktop

mac:
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
  signIgnore:
    # Skip non-binary files in the bundled Python environment during codesign.
    # Without this, @electron/osx-sign walks all ~25k files to find ~360 Mach-O
    # binaries, hitting the macOS 10240 open-files-per-process limit.
    - "/python/.*\\.(py|pyc|pyi|pxd|pyx|h|hpp|cpp|c|cuh|cu|tcl|txt|json|yaml|yml|toml|cfg|md|rst|html|css|enc|msg|cmake|gif|png|jpg|svg|xml|jinja|typed|al)$"
    - "/python/.*\\.dist-info/"
  # NOTE: python-embed is deliberately NOT bundled — see scripts/package-python.ps1
  # and docs/RELEASING.md. The app fetches it on first local generation.
        - "!__pycache__/**"
        - "!*.pyc"
  target:
    - target: dmg
      arch:
        - arm64
  icon: resources/icon.icns
  category: public.app-category.video
  artifactName: ${productName}-${arch}.${ext}

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Publish target repointed from Lightricks/ltx-desktop to this fork — the
# in-app updater is disabled (electron/updater.ts), but nothing in the build
# config should reference Lightricks' feed either.
publish:
  provider: github
  owner: taskmasterpeace
  repo: Directors-Desktop
